name: Actualizar datos (integral)

# Corre CADA HORA. El modo se decide solo por la hora (UTC) para no pasar los 100 req/dia:
#   horas 00, 06, 12, 18 -> MODE=full (todo: 4 fixtures + 3 tablas + 3 rankings = ~10 req)
#   resto de las horas    -> MODE=live (1 req: /fixtures?live=all)
#   Total ~ 4*10 + 20*1 = 60 requests/dia (limite 100).
on:
  schedule:
    - cron: '12 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = todo, live = solo en vivo'
        required: false
        default: 'full'
        type: choice
        options: [full, live]

permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Definir modo segun la hora
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
            echo "heavy=1" >> $GITHUB_OUTPUT
          else
            H=$(date -u +%H)
            case "$H" in
              00|06|18) echo "mode=full"  >> $GITHUB_OUTPUT; echo "heavy=0" >> $GITHUB_OUTPUT ;;
              12)       echo "mode=full"  >> $GITHUB_OUTPUT; echo "heavy=1" >> $GITHUB_OUTPUT ;;
              *)        echo "mode=live"  >> $GITHUB_OUTPUT; echo "heavy=0" >> $GITHUB_OUTPUT ;;
            esac
          fi

      - name: Descargar datos
        env:
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          SEASON: '2026'
          MODE: ${{ steps.mode.outputs.mode }}
          HEAVY: ${{ steps.mode.outputs.heavy }}
          DETALLE_PARTIDOS: '2'
          TEAM_ID: '451'
        run: |
          echo "MODE=$MODE HEAVY=$HEAVY"
          python scripts/fetch_data.py

      - name: Commitear cambios
        run: |
          git config user.name  "fixture-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/*.json
          if git diff --staged --quiet; then
            echo "Sin cambios."
          else
            git commit -m "data (${{ steps.mode.outputs.mode }}): $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
